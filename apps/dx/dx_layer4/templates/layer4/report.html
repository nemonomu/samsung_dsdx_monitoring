{% extends 'layer4/base_layer4.html' %}
{% load static %}

{% block page_title %}보고서{% endblock %}

{% block layer4_content %}
<!-- 보고서 컨트롤 -->
<div class="l4-report-controls" style="display: flex; justify-content: flex-end;">
    <button class="app-btn app-btn-sm app-btn-save" id="saveReportBtn" onclick="saveReportToDocument()">💾 보고서 저장</button>
</div>

<div id="reportSharePanel" hidden style="margin-bottom:16px;padding:12px 16px;border:1px solid #dce4ef;border-radius:8px;background:#fff;">
    <p id="reportShareMessage" role="status" style="margin:0 0 8px;"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input id="reportShareUrl" type="text" readonly hidden aria-label="저장한 보고서 공유 URL" style="flex:1;min-width:180px;padding:8px;border:1px solid #dce4ef;border-radius:6px;">
        <button class="app-btn app-btn-sm" id="reportShareRetry" onclick="retryReportShare()">링크 다시 복사</button>
    </div>
</div>

<!-- 보고서 영역 -->
<div class="l4-report-area">
    <div id="report-detail" class="l4-report-content">
        <div class="l4-empty-state">
            <p>날짜를 선택하고 조회 버튼을 클릭하세요.</p>
        </div>
    </div>
</div>
{% endblock %}

{% block layer4_js %}
<script src="{% static 'dx_layer4/js/common.js' %}?v=1"></script>
<script src="{% static 'dx_layer4/js/report.js' %}?v=20261020-save-share"></script>
{% endblock %}
