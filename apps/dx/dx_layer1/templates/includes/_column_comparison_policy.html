<p class="cs-footnote">기준 대비 = 비교일 수집 건수 ÷ 이전 28일 중 수집 완료된 최소 7일의 중앙값 × 100. 비교일은 기준에서 제외합니다. <span class="ccs-text-abnormal">0~30%: 이상</span> · <span class="ccs-text-review">30% 초과~60%: 확인 필요</span> · 60% 초과: 정상.</p>
<p class="cs-footnote">수집 완료는 기존 Layer 1 수집 시간대 기준입니다. 시간대가 끝나지 않은 날짜와 전체 미수집 날짜는 기준에서 제외합니다. 기준 이력이 7일 미만이거나 중앙값이 0이면 비교 불가로 표시합니다. 알림은 이 통계와 ‘컬럼 수집 이상’ 메뉴에서만 확인합니다.</p>
