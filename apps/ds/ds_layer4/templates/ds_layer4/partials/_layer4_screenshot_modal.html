<!-- 스크린샷 수동 업로드용 hidden input -->
<input type="file" id="screenshotFileInput" accept="image/png,image/jpeg" style="display:none" onchange="handleScreenshotUpload(this)">

<!-- 스크린샷 모달 -->
<div class="screenshot-modal" id="screenshotModal" onclick="closeScreenshotModal(event)">
    <div class="screenshot-modal-content" onclick="event.stopPropagation()" style="position: relative;">
        <div class="screenshot-modal-header">
            <div class="screenshot-modal-heading">
                <span class="screenshot-modal-title" id="screenshotTitle">스크린샷</span>
                <span class="screenshot-counter" id="screenshotCounter"></span>
            </div>
            <div class="screenshot-cause-editor" id="screenshotCauseEditor">
                <label for="screenshotCauseSelect">원인</label>
                <select id="screenshotCauseSelect" onchange="handleScreenshotCauseChange()"></select>
                <input type="text" id="screenshotCustomCause" maxlength="255" placeholder="원인을 직접 입력" oninput="markScreenshotCauseEdited()" onkeydown="handleScreenshotCauseKeydown(event)" hidden>
                <button type="button" id="screenshotCauseSaveBtn" onclick="saveScreenshotCause()" disabled>저장</button>
                <span class="screenshot-cause-readonly" id="screenshotCauseReadonly" hidden></span>
            </div>
            <div class="screenshot-modal-actions">
                <button class="screenshot-delete-btn" id="screenshotDeleteBtn" onclick="deleteScreenshot()" title="스크린샷 삭제" style="display:none;">🗑 삭제</button>
                <button class="screenshot-modal-close" onclick="closeScreenshotModal()">&times;</button>
            </div>
        </div>
        <div class="screenshot-product-info report-copy-section">
            <div class="report-copy-hint">셀 클릭 → Ctrl+C로 복사 · 복사 아이콘 한 번 클릭 · ↗ 새 창에서 열기</div>
            <div class="screenshot-product-scroll">
                <table class="screenshot-product-table" aria-label="캡처 상품 정보">
                    <colgroup>
                        <col style="width:120px;"><col><col style="width:25%;">
                        <col style="width:95px;"><col style="width:110px;">
                        <col style="width:180px;"><col style="width:20%;">
                    </colgroup>
                    <thead><tr><th>SKU</th><th>제목</th><th>IMAGEURL</th><th>가격</th><th>SHIPS FROM</th><th>SOLD BY</th><th>URL</th></tr></thead>
                    <tbody id="screenshotProductValues"></tbody>
                </table>
            </div>
        </div>
        <div class="screenshot-modal-body" id="screenshotBody">
            <!-- 이미지 또는 로딩 표시 -->
        </div>
        <button class="screenshot-nav prev" id="screenshotPrev" onclick="navigateScreenshot(-1)" style="display:none;" title="이전 스크린샷">&lsaquo;</button>
        <button class="screenshot-nav next" id="screenshotNext" onclick="navigateScreenshot(1)" style="display:none;" title="다음 스크린샷">&rsaquo;</button>
    </div>
</div>
