<div class="dx-sidebar" id="dx-sidebar">
    <div class="sidebar-header">
        <span class="sidebar-title">{{ sidebar_title }}</span>
        <button class="sidebar-collapse-btn" type="button" title="사이드바 접기">
            <span class="toggle-arrow">«</span>
        </button>
    </div>
    <nav class="sidebar-menu">
        <a href="{{ sidebar_base_url }}" class="sidebar-item {% if section == 'dashboard' %}active{% endif %}">
            <span class="sidebar-icon">📊</span>
            <span class="sidebar-text">대시보드</span>
        </a>
        {% for group in sidebar_groups %}
        <div class="sidebar-group {% if group.expanded %}expanded{% endif %}">
            <div class="sidebar-item-row {% if group.active %}active{% endif %}" onclick="toggleSidebarGroup(this)">
                <span class="sidebar-icon">{{ group.icon }}</span>
                <span class="sidebar-text">{{ group.label }}</span>
                <span class="sidebar-arrow">▶</span>
            </div>
            <div class="sidebar-subitems">
                {% for item in group.items %}
                {% if item.children %}
                <div class="sidebar-subgroup {% if item.active %}active expanded{% endif %}">
                    <button class="sidebar-subgroup-title" type="button"
                            aria-expanded="{% if item.active %}true{% else %}false{% endif %}"
                            aria-controls="sidebar-subgroup-{{ group.key }}-{{ item.name|slugify }}"
                            onclick="toggleSidebarSubgroup(this)">
                        <span>{{ item.name }}</span>
                        <span class="sidebar-subgroup-arrow" aria-hidden="true">▶</span>
                    </button>
                    <div class="sidebar-subgroup-children"
                         id="sidebar-subgroup-{{ group.key }}-{{ item.name|slugify }}"{% if not item.active %} hidden{% endif %}>
                        {% for child in item.children %}
                        <a class="sidebar-subitem sidebar-subgroup-child {% if child.active %}active{% endif %}"
                           data-item-name="{{ child.name }}"
                           data-detail-code="{{ child.detail_code|default:"" }}"
                           onclick="onSubitemClick('{{ group.key }}', '{{ child.name|escapejs }}', '{{ child.detail_code|default:""|escapejs }}')">
                            {{ child.label|default:child.name }}
                        </a>
                        {% endfor %}
                    </div>
                </div>
                {% else %}
                <a class="sidebar-subitem {% if item.active %}active{% endif %}"
                   onclick="onSubitemClick('{{ group.key }}', '{{ item.name|escapejs }}', '{{ item.detail_code|default:""|escapejs }}')">
                    {{ item.name }}
                </a>
                {% endif %}
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </nav>
</div>
